<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password</title>
</head>
<body style="margin:0;background:#f3f6f2;color:#1f2d25;font-family:Arial,sans-serif;font-size:16px;line-height:1.5">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr><td align="center" style="padding:24px 12px">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff">
        <tr><td style="padding:28px">
          <p style="margin:0;color:#24533b;font-weight:bold">CP Value Mart</p>
          <h1 style="margin:16px 0;font-size:24px">Reset your password</h1>
          <p>We received a request to reset your CP Value Mart password. Follow the link below to choose a new password.</p>
          <p><a href="{{ .SiteURL }}/auth/reset?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#24533b;color:#fff;padding:10px 16px;border-radius:4px;text-decoration:none;font-weight:bold">Reset password</a></p>
          <p style="margin:24px 0 0;border-top:1px solid #d9e2dc;padding-top:14px;font-size:14px">If you did not request a password reset, you can ignore this email.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
